# Cloudflare Worker for Parcade's rooms. Code: worker.js.
# Lives outside site/, so the Worker code never gets published with the game page.
#
# Deploy (from this folder, in a terminal; the browser login fails on this PC, so set
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID first, same as parcore's coc-api):
#   npx wrangler deploy
# Local test (0.0.0.0 lets phones on the same Wi-Fi join): npx wrangler dev --ip 0.0.0.0 --port 8787, then from the parcade folder: python -m http.server 8766 -d site
# Logs while testing: npx wrangler tail

name = "parcade"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# One Durable Object per room. SQLite-backed = the kind the free plan allows.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
